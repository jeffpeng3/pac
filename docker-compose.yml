services:
  pac:
    build: .
    image: pac-server:latest
    ports:
      - "8080:8080"
    environment:
      PROXY_TYPE: PROXY
      PROXY_ADDR: 192.168.1.1:7890
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
